services:
  nginx:
    build:
      context: ./deployments/nginx
    container_name: nginx_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployments/nginx/certs:/etc/nginx/certs:ro
      - ./deployments/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - api-v1-1
      - api-v1-2
      - api-v1-3
      - api-v2

  api-v1-1:
    build:
      context: ./src/api
      dockerfile: v1/Dockerfile
    volumes:
      - ./model/model.joblib:/app/model.joblib:ro

  api-v1-2:
    build:
      context: ./src/api
      dockerfile: v1/Dockerfile
    volumes:
      - ./model/model.joblib:/app/model.joblib:ro

  api-v1-3:
    build:
      context: ./src/api
      dockerfile: v1/Dockerfile
    volumes:
      - ./model/model.joblib:/app/model.joblib:ro

  api-v2:
    build:
      context: ./src/api
      dockerfile: v2/Dockerfile
    volumes:
      - ./model/model.joblib:/app/model.joblib:ro

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    container_name: nginx_exporter
    command:
      - "-nginx.scrape-uri=http://nginx:8080/nginx_status"
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_server
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - nginx_exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  prometheus_data:
  grafana_data: